name: Validate registry
on:
  pull_request:
    paths: [registry/**, scripts/validate-registry.mjs]
  push:
    branches: [main]
    paths: [registry/**, scripts/validate-registry.mjs]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/validate-registry.mjs
