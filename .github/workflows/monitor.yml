name: Monitor public sources

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: public-source-monitor
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/validate-registry.mjs
      - run: node scripts/monitor-sources.mjs
      # Payloads (title/label/body) are generated in node; the script below only decides
      # between `gh issue edit` and `gh issue create`, so the body never goes stale.
      - run: node scripts/monitor-issues.mjs sources > source-issues.json
      - name: Update or create source-monitor issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/upsert-issues.sh source-issues.json
      - run: |
          if git diff --quiet -- site/data; then exit 0; fi
          git config user.name 'model-commons-monitor[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data
          git commit -m 'chore: refresh public-source observations'
          git push

  report-stale-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/validate-registry.mjs
      # Emits the overdue list as an upsert payload, or a close payload when nothing is
      # overdue any more, so the single `registry-stale` issue always mirrors the registry.
      - run: node scripts/monitor-issues.mjs registry > registry-issues.json
      - name: Update or close the registry-stale issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/upsert-issues.sh registry-issues.json
